name: Firebase Hosting Preview

on:
  push:
    branches:
      - fix/mobile-nav-sales-reports-ci
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: firebase-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_preview:
    name: Build and publish a safe preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build preview site
        run: npm run build

      - name: Check Firebase preview credentials
        id: firebase_credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOK_PRO_911B4 }}
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Preview deployment skipped: add the Firebase service-account secret to enable it."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy pull request preview
        id: firebase_pr_preview
        if: github.event_name == 'pull_request' && steps.firebase_credentials.outputs.configured == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOK_PRO_911B4 }}"
          projectId: stok-pro-911b4
          expires: 14d

      - name: Deploy development branch preview
        id: firebase_branch_preview
        if: github.event_name != 'pull_request' && steps.firebase_credentials.outputs.configured == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOK_PRO_911B4 }}"
          projectId: stok-pro-911b4
          channelId: stokpro-review
          expires: 14d

      - name: Add preview link to the development pull request
        if: github.event_name != 'pull_request' && steps.firebase_credentials.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.firebase_branch_preview.outputs.url }}
        run: gh pr comment 1 --body "Stok-Pro test preview: ${PREVIEW_URL} (14 gün geçerlidir). Bu adres gerçek Firebase projesiyle konuşur; yalnızca test işletmesi kullanın."
