name: Firebase Hosting Production (Manual)

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Confirm that only Firebase Hosting for stok-pro-911b4 will be deployed"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  deploy_hosting_only:
    name: Build and deploy Hosting only
    if: github.ref == 'refs/heads/main' && inputs.confirm_production == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build production site
        run: npm run build

      - name: Require Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOK_PRO_911B4 }}
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_STOK_PRO_911B4 repository secret."
            exit 1
          fi

      - name: Deploy Firebase Hosting only (live)
        uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOK_PRO_911B4 }}"
          projectId: stok-pro-911b4
          channelId: live
